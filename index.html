  "The holographic card" from Animorio · https://animorio.com

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARUNGPALAKKA.COM — VIP MEMBER DISCOUNT CARD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&family=Raleway:wght@200;300;400&display=swap">
  <style>
    :root {
      --page: #000000;
      --ink: #f6f3ff;
      --muted: #a39dbd;
      --card: #15121f;
      --card-deep: #08070d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
    }

    body {
      min-height: 100svh;
      background: var(--page);
      color: var(--ink);
      font-family: 'Montserrat', system-ui, sans-serif;
      font-weight: 300;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .stage {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 40px 16px;
    }

    .pass {
      display: grid;
      justify-items: center;
      gap: 26px;
      perspective: 1100px;
    }

    /* ---------------------------------------------------------------- 3D card */
    .card {
      --gx: 50%;
      --gy: 30%;
      --glare: 0.5;
      --px: 0px;
      --py: 0px;
      position: relative;
      display: block;
      width: min(340px, 82vw);
      aspect-ratio: 340 / 476;
      padding: 0;
      border: 0;
      border-radius: 22px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      text-align: left;
      text-transform: uppercase;
      cursor: pointer;
      transform-style: preserve-3d;
      will-change: transform;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    .card:focus-visible {
      outline: none;
    }

    .card:focus-visible .card__face {
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1), 0 0 0 3px var(--page), 0 0 0 5px var(--ink);
    }

    .card__face {
      position: absolute;
      inset: 0;
      display: grid;
      overflow: hidden;
      border-radius: inherit;
      background:
        radial-gradient(120% 80% at 80% 0%, rgba(124, 92, 255, 0.28), transparent 60%),
        radial-gradient(90% 70% at 0% 100%, rgba(255, 110, 170, 0.16), transparent 60%),
        linear-gradient(160deg, var(--card), var(--card-deep));
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card__face--front {
      grid-template-rows: auto 1fr auto;
      padding: 24px 22px 22px;
    }

    .card__face--back {
      align-content: center;
      justify-items: center;
      gap: 13px;
      padding: 26px 24px;
      text-align: center;
      transform: rotateY(180deg);
    }

    /* holographic foil head silhouette */
    .card__lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .card__foil-art {
      opacity: 0.72;
    }

    /* subtle top & bottom scrim for legibility */
    .card__scrim {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(8, 7, 13, 0.62) 0%, transparent 26%, transparent 62%, rgba(8, 7, 13, 0.88) 92%);
      pointer-events: none;
    }

    /* diagonal sheen on tilt */
    .card__sheen {
      position: absolute;
      inset: -30%;
      background: linear-gradient(115deg, transparent 38%, rgba(255, 255, 255, 0.13) 47%, rgba(255, 255, 255, 0.02) 54%, transparent 60%);
      transform: translate(var(--sheen, 0%), 0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      pointer-events: none;
    }

    /* radial glare on both faces */
    .card__glare {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at var(--gx) var(--gy), rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.06) 28%, transparent 56%);
      opacity: var(--glare);
      transform: translateZ(1px);
      pointer-events: none;
    }

    /* ---------------------------------------------------------------- front face */
    .card__top,
    .card__title,
    .card__foot {
      position: relative;
      transform: translate(var(--px), var(--py));
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card__top {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .card__mark {
      width: 36px;
      height: 36px;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.45));
    }

    .card__kind {
      font-family: 'Raleway', 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.24em;
      color: var(--ink);
      line-height: 1.2;
    }

    .card__title {
      align-self: center;
      position: relative;
      top: 78px;
      font-family: 'Raleway', 'Montserrat', sans-serif;
      font-size: clamp(32px, 10vw, 42px);
      font-weight: 200;
      line-height: 1.12;
      letter-spacing: 0.16em;
      font-variant-numeric: lining-nums;
      color: transparent;
      background: linear-gradient(115deg, #ffffff 18%, #ffd2ec 30%, #c4f4ff 42%, #fff1bf 54%, #ffffff 66%, #e2d4ff 80%, #ffffff 92%);
      background-size: 260% 100%;
      background-position: var(--title, 50%) 0;
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.55));
    }

    .card__foot {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
    }

    .card__foot > span {
      display: grid;
      gap: 4px;
    }

    .card__foot > span:last-child {
      text-align: right;
      flex-shrink: 0;
    }

    .card__small {
      font-size: 8.5px;
      font-weight: 300;
      letter-spacing: 0.2em;
      color: var(--muted);
    }

    .card__name {
      font-size: 12.5px;
      font-weight: 300;
      letter-spacing: 0.12em;
      white-space: nowrap;
    }

    /* ---------------------------------------------------------------- back face (discount card) */
    .card__tag {
      padding: 6px 13px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.04);
      font-size: 8.5px;
      font-weight: 300;
      letter-spacing: 0.22em;
      color: #dfd8ff;
    }

    .card__discount {
      display: grid;
      gap: 6px;
    }

    .card__discount-val {
      font-family: 'Raleway', 'Montserrat', sans-serif;
      font-size: clamp(30px, 8.8vw, 38px);
      font-weight: 200;
      line-height: 1.08;
      letter-spacing: 0.14em;
      font-variant-numeric: lining-nums;
      color: transparent;
      background: linear-gradient(115deg, #ffffff 15%, #ffd36e 34%, #7dffbe 52%, #6cd4ff 70%, #ff7aa8 88%);
      background-size: 240% 100%;
      background-position: var(--title, 50%) 0;
      -webkit-background-clip: text;
      background-clip: text;
    }

    .card__discount-sub {
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.18em;
      color: #e6e1f8;
    }

    .card__promo {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px dashed rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.035);
    }

    .card__promo-code {
      font-family: 'Montserrat', sans-serif;
      font-size: 12.5px;
      font-weight: 300;
      letter-spacing: 0.2em;
      color: #ffd36e;
    }

    .card__code {
      width: 100%;
      height: 66px;
      border-radius: 10px;
    }

    .card__note {
      max-width: 34ch;
      font-size: 8.8px;
      font-weight: 300;
      line-height: 1.75;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    .card__note strong {
      font-weight: 400;
      color: var(--ink);
    }

    .card__back-foot {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 2px;
    }

    .card__mark--back {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .card__domain-back {
      font-family: 'Raleway', 'Montserrat', sans-serif;
      font-size: 10.5px;
      font-weight: 300;
      letter-spacing: 0.22em;
      color: var(--ink);
    }

    /* ---------------------------------------------------------------- bottom hint */
    .pass__hint {
      margin: 0;
      font-size: 10.5px;
      font-weight: 300;
      letter-spacing: 0.2em;
      color: var(--muted);
    }
  </style>
</head>

    const LIFT = 1.02;
    const SWAY = 0;
    const TURN = [120, 0.6];

    const HAS_GSAP = typeof gsap !== 'undefined';
    const ticker = HAS_GSAP ? gsap.ticker : (() => {
      const fns = []; let prev = performance.now();
      const loop = (now) => { const dt = now - prev; prev = now; fns.forEach((f) => f(now / 1000, dt)); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
      return { add: (f) => fns.push(f) };
    })();
    const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const card = document.querySelector('[data-card]');
    const foil = document.querySelector('[data-foil]');
    const code = document.querySelector('[data-code]');
    const hint = document.querySelector('[data-hint]');
    const pass = document.querySelector('[data-pass]');
    const front = card.querySelector('.card__face--front');
    const back = card.querySelector('.card__face--back');
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

    /* Back barcode */
    let bars = '<rect width="220" height="64" rx="8" fill="#fff"/>';
    let seed = 7;
    for (let x = 14; x < 206;) {
      seed = (seed * 9301 + 49297) % 233280;
      const w = 1 + (seed % 4);
      bars += `<rect x="${x}" y="10" width="${w}" height="44" fill="#0b0a10"/>`;
      x += w + 1 + ((seed >> 3) % 3);
    }
    code.innerHTML = bars;

    /* Spring physics */
    const s = {
      rx: 0, vrx: 0, ry: 0, vry: 0,
      turn: 0, vturn: 0,
      lift: 1, vlift: 0,
    };
    const want = { rx: 0, ry: 0, turn: 0, lift: 1 };
    let pointer = null;
    let still = 0;
    let clock = 0;
    let turned = false;
    let drawn = '';
    let shown = null;

    function spring(key, k, damp, h) {
      const v = `v${key}`;
      s[v] += ((want[key] - s[key]) * k - s[v] * 2 * Math.sqrt(k) * damp) * h;
      s[key] += s[v] * h;
    }

    ticker.add((time, dt) => {
      const t = Math.min(dt, 50) / 1000;
      clock += t;
      still += t;
      if (!pointer || !pointer.inside) {
        want.rx = 0;
        want.ry = 0;
        want.lift = 1;
      }
      /* Tilt follows the finger/mouse even with Reduce Motion on (same as the
         aquarium card); only the flip spin is made instant in that mode. */
      const steps = Math.max(1, Math.ceil(t / 0.004));
      for (let n = 0; n < steps; n++) {
        const h = t / steps;
        spring('rx', SPRING[0], SPRING[1], h);
        spring('ry', SPRING[0], SPRING[1], h);
        spring('lift', 260, 0.55, h);
        if (!REDUCED) spring('turn', TURN[0], TURN[1], h);
      }
      if (REDUCED) { s.turn = want.turn; s.vturn = 0; }
      draw();
    });

    function draw() {
      const key = `${s.rx.toFixed(2)} ${s.ry.toFixed(2)} ${s.turn.toFixed(2)} ${s.lift.toFixed(4)}`;
      if (key === drawn) return;
      drawn = key;
      const edge = Math.abs(Math.sin((s.turn * Math.PI) / 180));
      card.style.transform = `rotateX(${s.rx.toFixed(2)}deg) rotateY(${(s.ry + s.turn).toFixed(2)}deg) scale(${(s.lift * (1 - 0.06 * edge)).toFixed(4)})`;
      const nx = clamp(s.ry / TILT, -1.4, 1.4);
      const ny = clamp(-s.rx / TILT, -1.4, 1.4);
      const away = Math.cos((s.turn * Math.PI) / 180) < 0;
      if (away !== shown) {
        shown = away;
        front.style.visibility = away ? 'hidden' : '';
        back.style.visibility = away ? '' : 'hidden';
      }
      card.style.setProperty('--gx', `${(50 + nx * 42 * (away ? -1 : 1)).toFixed(1)}%`);
      card.style.setProperty('--gy', `${(40 + ny * 46).toFixed(1)}%`);
      card.style.setProperty('--glare', (0.45 + 0.55 * Math.min(1, Math.hypot(nx, ny))).toFixed(3));
      card.style.setProperty('--sheen', `${(nx * 28).toFixed(1)}%`);
      card.style.setProperty('--title', `${(50 + nx * 40 + ny * 18).toFixed(1)}%`);
      card.style.setProperty('--px', `${(nx * 5).toFixed(2)}px`);
      card.style.setProperty('--py', `${(ny * 5).toFixed(2)}px`);
      foil.setAttribute('gradientTransform', `translate(${(nx * 150).toFixed(1)} ${(ny * 190).toFixed(1)})`);
    }

    /* Pointer & touch interaction
       Like the aquarium card: the card itself listens for movement, so the tilt
       follows the finger while it slides over the card. Touch events are handled
       directly as well, because some mobile browsers/webviews stop sending
       pointermove to a <button> once a finger moves. */
    let downAt = null;
    let dragged = false;
    let lastTouch = 0;
    function aim(x, y) {
      const r = card.getBoundingClientRect();
      const nx = (x - (r.left + r.width / 2)) / (r.width / 2);
      const ny = (y - (r.top + r.height / 2)) / (r.height / 2);
      const inside = Math.abs(nx) <= 1.15 && Math.abs(ny) <= 1.15;
      pointer = { nx: clamp(nx, -1, 1), ny: clamp(ny, -1, 1), inside };
      still = 0;
      want.ry = inside ? pointer.nx * TILT : 0;
      want.rx = inside ? -pointer.ny * TILT : 0;
      want.lift = inside ? LIFT : 1;
      if (downAt && Math.hypot(x - downAt.x, y - downAt.y) > 10) dragged = true;
    }
    const rest = () => { pointer = null; };

    /* Mouse / pen */
    card.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'touch') return;
      aim(e.clientX, e.clientY);
    });
    card.addEventListener('pointerleave', (e) => {
      if (e.pointerType !== 'touch') rest();
    });

    /* Touch */
    card.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      lastTouch = Date.now();
      downAt = { x: t.clientX, y: t.clientY };
      dragged = false;
      aim(t.clientX, t.clientY);
    }, { passive: true });
    card.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      if (e.cancelable) e.preventDefault(); // keep the page still while tilting
      aim(t.clientX, t.clientY);
    }, { passive: false });
    const touchDone = () => { lastTouch = Date.now(); downAt = null; rest(); };
    card.addEventListener('touchend', touchDone);
    card.addEventListener('touchcancel', () => { dragged = true; touchDone(); });

    /* Tap flips the card; sliding a finger across it only tilts. */
    card.addEventListener('click', (e) => {
      if (dragged && Date.now() - lastTouch < 600) { dragged = false; return; }
      dragged = false;
      turned = !turned;
      want.turn = turned ? 180 : 0;
      card.setAttribute('aria-pressed', String(turned));
      card.setAttribute('aria-label', turned
        ? 'BACK OF ARUNGPALAKKA.COM DISCOUNT CARD. PRESS TO RETURN TO FRONT'
        : 'VIP MEMBER CARD ARUNGPALAKKA.COM. PRESS TO FLIP');
      hint.textContent = turned ? 'TAP CARD TO RETURN TO FRONT' : 'TAP CARD TO VIEW DISCOUNT DETAILS';
      if (REDUCED) {
        HAS_GSAP && gsap.fromTo(pass, { opacity: 0.2 }, { opacity: 1, duration: 0.3, clearProps: 'opacity' });
        return;
      }
    });

    /* Entrance animation */
    draw();
    if (!REDUCED) {
      s.rx = 24;
      s.ry = -30;
      s.lift = 0.9;
      if (HAS_GSAP) gsap.from(pass, { opacity: 0, duration: 0.6, ease: 'power2.out', clearProps: 'opacity' });
      if (HAS_GSAP) gsap.from(hint, { y: 10, opacity: 0, duration: 0.6, delay: 0.35, ease: 'power3.out', clearProps: 'transform,opacity' });
    }
  
  </script>
</body>
</html>
